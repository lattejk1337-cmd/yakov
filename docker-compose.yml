services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wallet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://wallet:${POSTGRES_PASSWORD}@db:5432/wallet
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS in front of the app: Caddy obtains and renews a Let's Encrypt certificate for DOMAIN.
  caddy:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:3000
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
