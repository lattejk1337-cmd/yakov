services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wallet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://wallet:${POSTGRES_PASSWORD}@db:5432/wallet
    depends_on:
      db:
        condition: service_healthy
    # Put a TLS-terminating reverse proxy in front: Telegram requires HTTPS.
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

volumes:
  pgdata:
