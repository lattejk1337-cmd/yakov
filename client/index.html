<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Глухой Час — Dead Hour</title>
    <!-- Yandex Games SDK (served by the platform); absent locally, the game falls back gracefully -->
    <script src="/sdk.js" data-ysdk onerror="this.dataset.failed='1'"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="touch"></div>
    <div id="ui"></div>
    <div id="rotate"><div>⟲</div><p data-ru="Поверните устройство горизонтально" data-en="Please rotate your device to landscape"></p></div>
    <noscript>JavaScript is required.</noscript>
    <script type="module" src="src/main.js"></script>
    <script>
      // rotate hint text before the app loads
      (function () {
        var l = (navigator.language || 'ru').slice(0, 2);
        var p = document.querySelector('#rotate p');
        p.textContent = l === 'ru' || l === 'be' || l === 'uk' || l === 'kk' ? p.dataset.ru : p.dataset.en;
      })();
    </script>
  </body>
</html>
